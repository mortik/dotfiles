---
- block:

    - name: ensure apt keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: fetch ultradvorka PPA signing key
      get_url:
        url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x1966720467792BF00772E4A8A78C95E7CDE35065"
        dest: /etc/apt/keyrings/ultradvorka.asc
        mode: '0644'

    - name: add hh repo
      deb822_repository:
        name: ultradvorka
        types: deb
        uris: https://ppa.launchpadcontent.net/ultradvorka/ppa/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: /etc/apt/keyrings/ultradvorka.asc
        state: present

    - name: install hh
      apt:
        name: hh
        update_cache: yes
        state: latest

    - name: make sure bashrc.d folder is present
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d"
        state: directory
      when: shell == 'bash'
      tags: shell

    - name: make sure zshrc.d folder is present
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc.d"
        state: directory
      when: shell == 'zsh'
      tags: shell

    - name: setup bash config
      copy:
        src: "hh.bash"
        dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d/hh.bash"
      when: shell == 'bash'
      tags: shell

    - name: setup zsh config
      copy:
        src: "hh.zsh"
        dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc.d/hh.zsh"
      when: shell == 'zsh'
      tags: shell

  become: yes
  become_method: sudo
  when: ansible_facts['distribution'] == 'Ubuntu'

- block:

    - name: install hstr
      homebrew:
        name: hstr
        state: latest

    - name: make sure zshrc.d folder is present
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc.d"
        state: directory
      when: shell == 'zsh'
      tags: shell

    - name: setup zsh config
      copy:
        src: "hh.zsh"
        dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc.d/hh.zsh"
      when: shell == 'zsh'
      tags: shell

  when: ansible_facts['os_family'] == 'Darwin'
