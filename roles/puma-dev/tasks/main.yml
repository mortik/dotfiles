---
- block:

    - name: tap puma/puma
      homebrew_tap:
        name: puma/puma
        state: present

    - name: install puma-dev
      homebrew:
        name: puma/puma/puma-dev
        state: present

    # Creates the /etc/resolver directory, user-owned. The per-domain entry
    # inside it is written by the agent on every start, so it is deliberately
    # not managed here: a file placed by root under /private/etc inherits the
    # SIP restricted flag, and the agent then crash-loops on "permission
    # denied" trying to rewrite it.
    - name: create /etc/resolver directory
      command: "{{ homebrew_path }}/bin/puma-dev -setup"
      args:
        creates: /etc/resolver
      become: yes
      become_method: sudo

    - name: ensure puma-dev app directory exists
      file:
        path: "{{ puma_dev_dir }}"
        state: directory
        mode: "0755"

    - name: ensure LaunchAgents directory exists
      file:
        path: "{{ ansible_facts['env'].HOME }}/Library/LaunchAgents"
        state: directory
        mode: "0755"

    - name: install puma-dev launchd agent
      template:
        src: io.puma.dev.plist.j2
        dest: "{{ ansible_facts['env'].HOME }}/Library/LaunchAgents/io.puma.dev.plist"
        mode: "0644"
      notify:
        - reload puma-dev

    - name: link puma-dev apps to ports
      copy:
        content: "{{ item.port }}\n"
        dest: "{{ puma_dev_dir }}/{{ item.name }}"
        mode: "0644"
      with_items: "{{ puma_dev_apps }}"

  when: ansible_facts['os_family'] == 'Darwin'
