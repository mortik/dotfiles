---
- name: install yarn
  homebrew:
    name: yarn
    state: latest
  when: ansible_facts['os_family'] == 'Darwin'

- name: install yarn
  pacman:
    name: yarn
    state: latest
    update_cache: yes
  become: yes
  become_method: sudo
  when: ansible_facts['os_family'] == 'Archlinux'

- block:

    - name: ensure apt keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: fetch yarn signing key
      get_url:
        url: https://dl.yarnpkg.com/debian/pubkey.gpg
        dest: /etc/apt/keyrings/yarn.asc
        mode: '0644'

    - name: remove legacy yarn sourceslist
      file:
        path: /etc/apt/sources.list.d/yarnsources.list
        state: absent

    - name: add yarn apt repository
      deb822_repository:
        name: yarn
        types: deb
        uris: https://dl.yarnpkg.com/debian/
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/yarn.asc
        state: present

    - name: install yarn
      apt:
        name: yarn
        state: present
        update_cache: yes

  become: yes
  become_method: sudo
  when: ansible_facts['distribution'] == 'Ubuntu'
