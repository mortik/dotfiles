---
- name: install gnupg
  homebrew:
    name: gnupg
    state: latest
  when: ansible_facts['os_family'] == 'Darwin'

- name: install pinentry
  homebrew:
    name: pinentry-mac
    state: latest
  when: ansible_facts['os_family'] == 'Darwin'

- name: install gpg-suite
  homebrew_cask:
    name: gpg-suite
    state: present
    accept_external_apps: True
    sudo_password: "{{ ansible_become_pass | default('') }}"
  when: ansible_facts['os_family'] == 'Darwin'

- name: install gnupg
  pacman:
    name: gnupg
    state: latest
    update_cache: yes
  become: yes
  become_method: sudo
  when: ansible_facts['os_family'] == 'Archlinux'

- name: install gnupg
  apt:
    name: gnupg
    update_cache: yes
    state: latest
  become: yes
  become_method: sudo
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: setup gpg dir
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.gnupg"
    state: directory

- name: setup gpg conf
  template:
    src: gpg.conf.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.gnupg/gpg.conf"

- name: setup gpg agent conf
  copy:
    src: gpg-agent.conf
    dest: "{{ ansible_facts['env']['HOME'] }}/.gnupg/gpg-agent.conf"

- name: check if gpg secret key already imported
  command: "gpg --list-secret-keys {{ gpg_default_key_id }}"
  register: gpg_key_check
  changed_when: false
  failed_when: false
  when:
    - gpg_secret_key is defined
    - gpg_default_key_id is defined

- name: import gpg secret key
  shell:
    cmd: gpg --batch --import
    stdin: "{{ gpg_secret_key | b64decode }}"
  no_log: true
  when:
    - gpg_secret_key is defined
    - (gpg_secret_key | string | length) > 0
    - gpg_default_key_id is defined
    - gpg_key_check.rc != 0

- name: make sure bashrc.d folder is present
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d"
    state: directory
  when: shell == 'bash'
  tags: shell

- name: make sure zshrc.d folder is present
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc.d"
    state: directory
  when: shell == 'zsh'
  tags: shell

- name: setup gnupg bash
  copy:
    src: gnupg.bash
    dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d/gnupg.bash"
  when: shell == 'bash'
  tags: shell

- name: setup gnupg zsh
  copy:
    src: gnupg.zsh
    dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc.d/gnupg.zsh"
  when: shell == 'zsh'
  tags: shell
