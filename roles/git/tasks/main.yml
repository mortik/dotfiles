---
- name: install git
  homebrew:
    name: git
    state: latest
  when: ansible_facts['os_family'] == 'Darwin'

- name: install git
  pacman:
    name: git
    state: latest
    update_cache: yes
  become: yes
  become_method: sudo
  when: ansible_facts['os_family'] == 'Archlinux'

- block:

    - name: ensure apt keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: fetch git-core PPA signing key
      get_url:
        url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF911AB184317630C59970973E363C90F8F1B6217"
        dest: /etc/apt/keyrings/git-core.asc
        mode: '0644'

    - name: add git ppa
      deb822_repository:
        name: git-core
        types: deb
        uris: https://ppa.launchpadcontent.net/git-core/ppa/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: main
        signed_by: /etc/apt/keyrings/git-core.asc
        state: present

    - name: install git
      apt:
        name: git
        state: latest
        update_cache: yes

  become: yes
  become_method: sudo
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: copy files
  copy:
    src: "{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
  with_items:
    - .gitignore_global
    - .gitmessage.txt

- name: copy gitconfig
  template:
    src: ".gitconfig"
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
