---
- name: create claude config directory
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude"
    state: directory

- name: setup claude-code settings
  copy:
    src: "settings.json"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"

- name: setup claude-code global CLAUDE.md
  copy:
    src: "CLAUDE.md"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/CLAUDE.md"
