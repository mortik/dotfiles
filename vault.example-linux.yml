user: "op://your-vault/dotfiles/user"
hostname: ""
git_user_name: "op://your-vault/dotfiles/git-user-name"
git_user_email: "op://your-vault/dotfiles/git-user-email"
github_user: "op://your-vault/dotfiles/github-user"
github_token: "op://your-vault/dotfiles/github-token"
gpg_default_key_id: "op://your-vault/dotfiles/gpg-default-key-id"
gpg_secret_key: "op://your-vault/dotfiles/gpg-secret-key"
editor: "code"
vhosts:
  - { domain: "rails-app.dev", path: "~/dev/rails", port: 3000, type: rails }
  - { domain: "phoenix-app.dev", path: "~/dev/phoenix", port: 4000, type: phoenix }
  - { domain: "static.dev", path: "~/dev/static", type: static }
vscode_projects:
  - { name: ".dotfiles", path: "$home/.dotfiles" }
vscode_circleci_api_key: "op://your-vault/dotfiles/vscode-circleci-api-key"
